name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned by full commit SHA (M2 #3); the comment gives the version.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Embedding model cache key
        id: hf-key
        # Model name and pinned revision come from Settings defaults (single source of truth).
        run: |
          key=$(uv run python -c 'from studiodesk.config import Settings; s = Settings(_env_file=None); print(f"{s.embedding_model}-{s.embedding_model_revision}".replace("/", "_"))')
          echo "key=hf-${key}" >> "$GITHUB_OUTPUT"

      - name: Cache Hugging Face models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-key.outputs.key }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: |
          uv run mypy src
          uv run mypy evals

      - name: Tests
        run: uv run pytest -q --cov=studiodesk --cov-report=term-missing

      - name: Offline evals
        # Fake LLM + hashing embedder: no keys, no network, reads no .env; writes the
        # gitignored evals/reports/offline.* only.
        run: uv run python -m evals.run --offline

      - name: Validate dataset
        run: uv run python scripts/validate_dataset.py

      - name: Dependency audit
        run: uv run pip-audit

      - name: Audit public torch version
        # pip-audit skips local versions such as 2.14.1+cpu (not on PyPI), so audit the
        # matching public release of every locked torch version instead.
        run: |
          set -euo pipefail
          versions=$(uv export --frozen --no-hashes --no-dev --no-emit-project \
            | sed -nE 's/^torch==([0-9][^ ;+]*).*/\1/p' | sort -u)
          if [ -z "$versions" ]; then
            echo "torch not found in uv export" >&2
            exit 1
          fi
          printf 'torch==%s\n' $versions > "$RUNNER_TEMP/torch-public.txt"
          cat "$RUNNER_TEMP/torch-public.txt"
          uv run pip-audit -r "$RUNNER_TEMP/torch-public.txt" --no-deps --disable-pip

  docker:
    # Build the production image and smoke-test it (M2 #10). Nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: studiodesk:ci

      - name: Smoke-test the container
        # Env vars only (no .env in the image). The Qdrant URL is a placeholder: /health,
        # / and /api/demo-info do not query Qdrant.
        run: |
          set -euo pipefail
          docker run -d --name studiodesk -p 7860:7860 \
            -e APP_ENV=prod -e QDRANT_URL=https://example.cloud.qdrant.io studiodesk:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/health | grep -q '"status":"ok"'
          curl -fsS -D "$RUNNER_TEMP/index.headers" -o /dev/null http://127.0.0.1:7860/
          grep -qi '^content-security-policy:' "$RUNNER_TEMP/index.headers"
          grep -qi '^strict-transport-security:' "$RUNNER_TEMP/index.headers"
          curl -fsS http://127.0.0.1:7860/api/demo-info \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["game"] == "Starfall Outpost", d'
          test "$(docker exec studiodesk id -u)" = "1000"

      - name: Container logs
        if: always()
        run: docker logs studiodesk || true

      - name: Stop container
        if: always()
        run: docker rm -f studiodesk || true

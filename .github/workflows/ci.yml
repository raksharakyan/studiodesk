name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Embedding model cache key
        id: hf-key
        # Model name and pinned revision come from Settings defaults (single source of truth).
        run: |
          key=$(uv run python -c 'from studiodesk.config import Settings; s = Settings(_env_file=None); print(f"{s.embedding_model}-{s.embedding_model_revision}".replace("/", "_"))')
          echo "key=hf-${key}" >> "$GITHUB_OUTPUT"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-key.outputs.key }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q --cov=studiodesk --cov-report=term-missing

      - name: Validate dataset
        run: uv run python scripts/validate_dataset.py

      - name: Dependency audit
        run: uv run pip-audit
